---
# SFC integration tests: builds the pushed tree in CodeBuild and runs the end-to-end suite in all three
# deployment modes against real AWS destinations and in-container counterparts.
#
# Runs on EVERY branch. No long-lived AWS credentials: the job exchanges its GitHub OIDC token for the
# CI role created by ci/cdk, which may only upload source, start/inspect/stop this one project and read
# its evidence.
#
# Setup, once per repository, from the stack outputs:
#   gh variable set SFC_IT_ROLE_ARN --body <CiRoleArn>
#   gh variable set SFC_IT_BUCKET   --body <ArtifactsBucket>
#   gh variable set SFC_IT_REGION   --body <region>
name: Integration-Tests

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      profile:
        description: 'push (P0+P1) or full (everything)'
        required: false
        default: 'push'
        type: choice
        options: ['push', 'full']
  schedule:
    # Nightly full run on the default branch.
    - cron: '17 2 * * *'

# Per ref: a new push cancels the previous run of the same branch. That is safe only because the
# "stop the build" step below runs on cancellation and stops the CodeBuild build it started.
concurrency:
  group: sfc-it-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SFC_IT_BUCKET: ${{ vars.SFC_IT_BUCKET }}
      # full on the nightly schedule and on main, push (P0+P1) on every other branch.
      SFC_IT_PROFILE: ${{ inputs.profile || ((github.event_name == 'schedule' || github.ref == 'refs/heads/main') && 'full') || 'push' }}
    steps:
      - name: Check configuration
        id: config
        # Without the variables (a fork, or a clone with no stack) the job says so plainly instead of
        # failing on credentials. No repository name is hard-coded.
        run: |
          if [ -z "${{ vars.SFC_IT_ROLE_ARN }}" ] || [ -z "${{ vars.SFC_IT_BUCKET }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### SFC integration tests: not configured"
              echo "Set the repository variables SFC_IT_ROLE_ARN, SFC_IT_BUCKET and SFC_IT_REGION from the ci/cdk stack outputs."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.config.outputs.configured == 'true'
        with:
          # settings.gradle.kts derives the version from `git describe --tags`, and start-build.sh ships
          # .git so CodeBuild sees the same tags.
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.config.outputs.configured == 'true'
        with:
          role-to-assume: ${{ vars.SFC_IT_ROLE_ARN }}
          aws-region: ${{ vars.SFC_IT_REGION }}
          role-session-name: sfc-it-${{ github.run_id }}
          # A build can queue 10 minutes and run 50; the session has to outlive both.
          role-duration-seconds: 7200

      - name: Start the build
        id: start
        if: steps.config.outputs.configured == 'true'
        env:
          SFC_E2E_COMMIT: ${{ github.sha }}
          SFC_E2E_REF: ${{ github.ref_name }}
          SFC_E2E_DIRTY: '0'
        # Writes build_id to $GITHUB_OUTPUT immediately, so the steps below can stop and fetch even when
        # the wait fails or the job is cancelled.
        run: ci/start-build.sh --no-wait --profile "$SFC_IT_PROFILE"

      - name: Wait for the build
        if: steps.config.outputs.configured == 'true' && steps.start.outputs.build_id != ''
        run: ci/wait-build.sh "${{ steps.start.outputs.build_id }}"

      - name: Stop the build if it is still running
        if: always() && steps.start.outputs.build_id != ''
        run: |
          STATUS=$(aws codebuild batch-get-builds --ids "${{ steps.start.outputs.build_id }}" \
                     --query 'builds[0].buildStatus' --output text 2>/dev/null || echo UNKNOWN)
          if [ "$STATUS" = "IN_PROGRESS" ]; then
            aws codebuild stop-build --id "${{ steps.start.outputs.build_id }}" >/dev/null && echo "stopped"
          fi

      - name: Fetch the report and evidence
        if: always() && steps.start.outputs.build_id != ''
        run: |
          RUN="${{ steps.start.outputs.build_id }}"; RUN="${RUN##*:}"
          mkdir -p report
          aws s3 cp "s3://${SFC_IT_BUCKET}/evidence/${RUN}/" report/ --recursive --exclude 'artifacts/*' --only-show-errors || true

      - name: Publish the report to the run summary
        if: always() && steps.start.outputs.build_id != ''
        run: |
          RESULTS=$(find report -maxdepth 1 -name results.json | head -1)
          if [ -n "$RESULTS" ]; then
            # $GITHUB_STEP_SUMMARY truncates silently at 1 MiB; the renderer keeps within a byte budget.
            python3 ci/e2e/lib/report.py "$RESULTS" --budget 900000 >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### SFC integration tests: no report produced - see the CodeBuild logs" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report and evidence
        if: always() && steps.start.outputs.build_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: sfc-it-${{ github.run_id }}-${{ github.run_attempt }}
          path: report/
          retention-days: 14
          if-no-files-found: ignore
