# omni-plc-sim: server-side PLC protocol simulators for the SFC end-to-end suite (ci/e2e). Built in
# CodeBuild by the project sfc-integration-test-plc-sim from ci/omni-plc-sim/Dockerfile; see README.md.

[package]
name = "omni-plc-sim"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false
license = "Apache-2.0"
description = "S7, ADS, PCCC, SLMP and Modbus TCP PLC simulators for the SFC end-to-end tests"

# One feature per protocol, all on by default. A protocol can be built on its own with
# `--no-default-features --features <name>`.
[features]
default = ["s7", "ads", "pccc", "slmp", "modbus"]
s7 = []
ads = []
pccc = []
slmp = []
modbus = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "signal", "sync"] }

[profile.release]
codegen-units = 4

# ------------------------------------------------------------------------------------------------ credits
# Every source the simulator rests on. Cargo ignores [package.metadata].
#
# No third-party source code is copied into this crate; that was checked against everything the research
# fetched. The references and specifications supplied protocol facts: frame layouts, function, device and
# error codes, limits and identity strings. The crates are compiled in.

# Libraries and documentation consulted for how real PLCs and SFC's clients behave.
[[package.metadata.credits.references]]
name = "Apache PLC4X 0.9.1"
by = "The Apache Software Foundation"
url = "https://plc4x.apache.org"
license = "Apache-2.0"
used = "s7: the client SFC's S7 adapter runs. Its jars, read with javap, gave the COTP and S7 parameters, the TSAP encoding, the SZL request and the item encoding the simulator answers"

[[package.metadata.credits.references]]
name = "snap7"
by = "Davide Nardella"
url = "https://github.com/davenardella/snap7"
license = "LGPL-3.0"
used = "s7: the SZL 0x0011 and 0x001C record offsets its GetOrderCode and GetCpuInfo read, and its timer and counter numbering"

[[package.metadata.credits.references]]
name = "pycomm3"
by = "Ian Ottoway, Agostino Ruscito"
url = "https://github.com/ottowayi/pycomm3"
license = "MIT"
files = ["pycomm3/slc_driver.py", "pycomm3/cip/pccc.py", "pycomm3/cip/status_info.py"]
used = "pccc: SLC and MicroLogix address syntax, PCCC data-type codes and element sizes, STS and EXT STS codes"

[[package.metadata.credits.references]]
name = "Nmap enip-info script documentation"
by = "The Nmap Project"
url = "https://nmap.org/nsedoc/scripts/enip-info.html"
used = "pccc: the ListIdentity fields a real controller reports"

[[package.metadata.credits.references]]
name = "pymcprotocol"
by = "Yohei Osawa"
url = "https://github.com/senrust/pymcprotocol"
license = "MIT"
files = ["src/pymcprotocol/mcprotocolconst.py", "src/pymcprotocol/type3e.py", "src/pymcprotocol/mcprotocolerror.py"]
used = "slmp: MELSEC device codes, the 3E binary device specification per CPU series, the subcommands, end code C059"

[[package.metadata.credits.references]]
name = "plc-comm-slmp-rust"
by = "fa-yoshinobu"
url = "https://github.com/fa-yoshinobu/plc-comm-slmp-rust"
license = "MIT"
files = ["README.md", "src/client_rules.rs", "src/client.rs", "src/address.rs"]
used = "slmp: which devices, including the long timers and counters (LTN, LSTN, LCN, LZ), each CPU series can read, and how"

[[package.metadata.credits.references]]
name = "PLC communication docs: SLMP"
by = "fa-yoshinobu"
url = "https://plc-comm-docs-site.fa-labo.com/slmp/"
used = "slmp: per-CPU point limits and the end codes for exceeding them, the SD registers that hold device point counts, end codes, iQ-R Ethernet settings"

[[package.metadata.credits.references]]
name = "Shop Floor Connectivity (this repository)"
by = "Amazon.com, Inc. or its affiliates"
url = "https://github.com/awslabs/industrial-shopfloor-connect"
license = "Apache-2.0"
used = "the client code of the adapters (adapters/s7, ads, pccc, slmp, modbus-tcp): the exact requests the simulator answers; examples/in-process-ads-s3/main.tmc: the ADS MAIN symbols"

# The published specifications the servers follow.
[[package.metadata.credits.specifications]]
name = "RFC 1006: ISO Transport Service on top of the TCP"
by = "IETF"
url = "https://www.rfc-editor.org/rfc/rfc1006"
used = "s7: TPKT framing"

[[package.metadata.credits.specifications]]
name = "ISO 8073 / ITU-T X.224: Connection-oriented transport protocol"
by = "ISO, ITU-T"
url = "https://www.itu.int/rec/T-REC-X.224"
used = "s7: COTP class 0 (CR, CC, DT, DR, DC)"

[[package.metadata.credits.specifications]]
name = "Beckhoff Information System: ADS and AMS (TC1000 TwinCAT 3 ADS)"
by = "Beckhoff Automation"
url = "https://infosys.beckhoff.com"
used = "ads: AMS/TCP header, ADS commands, index groups, error codes"

[[package.metadata.credits.specifications]]
name = "The CIP Networks Library, Volume 2: EtherNet/IP Adaptation of CIP"
by = "ODVA"
url = "https://www.odva.org"
used = "pccc: encapsulation, RegisterSession, SendRRData, ListIdentity, common packet format"

[[package.metadata.credits.specifications]]
name = "DF1 Protocol and Command Set Reference Manual (1770-6.5.16)"
by = "Rockwell Automation"
url = "https://literature.rockwellautomation.com/idc/groups/literature/documents/rm/1770-rm516_-en-p.pdf"
used = "pccc: protected typed logical read (CMD 0F, FNC A2), STS and EXT STS codes"

[[package.metadata.credits.specifications]]
name = "SLMP Reference Manual (SH-080956ENG)"
by = "Mitsubishi Electric"
used = "slmp: 3E binary frame, batch and random reads, end codes"

[[package.metadata.credits.specifications]]
name = "MELSEC Communication Protocol Reference Manual (SH-080008)"
by = "Mitsubishi Electric"
used = "slmp: the QnA-compatible 3E frame of the Q and L series"

[[package.metadata.credits.specifications]]
name = "Modbus Application Protocol Specification V1.1b3"
by = "Modbus Organization"
url = "https://modbus.org/specs.php"
used = "modbus: function codes 1 to 4 and 0x2B/0x0E, exceptions"

[[package.metadata.credits.specifications]]
name = "MODBUS Messaging on TCP/IP Implementation Guide V1.0b"
by = "Modbus Organization"
url = "https://modbus.org/specs.php"
used = "modbus: MBAP header"

[[package.metadata.credits.specifications]]
name = "RFC 3339: Date and Time on the Internet: Timestamps"
by = "IETF"
url = "https://www.rfc-editor.org/rfc/rfc3339"
