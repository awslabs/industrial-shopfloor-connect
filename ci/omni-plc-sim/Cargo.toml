# omni-plc-sim: server-side PLC protocol simulators for the SFC end-to-end suite (ci/e2e). Built in
# CodeBuild by the project sfc-integration-test-plc-sim from ci/omni-plc-sim/Dockerfile; see README.md.

[package]
name = "omni-plc-sim"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false
license = "Apache-2.0"
description = "S7, ADS, PCCC, SLMP and Modbus TCP PLC simulators for the SFC end-to-end tests"

# One feature per protocol, all on by default. A protocol can be built on its own with
# `--no-default-features --features <name>`.
[features]
default = ["s7", "ads", "pccc", "slmp", "modbus"]
s7 = []
ads = []
pccc = []
slmp = []
modbus = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "signal", "sync"] }

[profile.release]
codegen-units = 4
