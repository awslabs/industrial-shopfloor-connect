# Single source of truth for every third-party dependency version.
#
# Modules must NOT declare literal versions or local `val xxxVersion` constants.
# Add an alias here and reference it as `libs.<alias>` instead. A CI check enforces this.
#
# Exception: buildSrc cannot see this catalog from precompiled script plugins, so the Kotlin
# compiler version lives in buildSrc/build.gradle.kts (kotlin-gradle-plugin) and
# buildSrc/src/main/kotlin/sfc.kotlin-common-conventions.gradle.kts (kotlin-stdlib, junit).
# Those two must stay in step with `kotlin` below.

[versions]
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlin-reflect = "2.4.20"

# AWS
awssdk = "2.55.2"
awssdk-crt = "0.48.4"
aws-encryption-sdk = "3.0.2"
aws-sdk-v1-core = "1.12.395"   # AWS SDK for Java v1 (end-of-support) - only aws-msk-target
msk-iam-auth = "2.3.8"

# Logging
log4j = "2.26.1"
slf4j = "2.0.19"

# Serialization / data
gson = "2.14.0"
jackson = "2.22.3"
protobuf = "3.25.9"      # aligned with what grpc declares; see grpc-protobuf POM
grpc = "1.84.0"
grpcKotlin = "1.5.0"
jmespath = "0.6.0"
velocity-engine = "2.4.1"
velocity-tools = "3.1"

# Big data
iceberg = "1.11.0"
parquet = "1.18.1"
parquet-format = "2.14.0"
hadoop = "3.5.0"
kafka = "4.3.1"

# Protocols
milo = "1.1.7"                 # requires Java 17 (bytecode major 61)
paho = "1.2.5"
plc4x = "0.9.1"
snmp4j = "3.13.1"
jnats = "2.26.3"
ktor = "2.3.10"

# JDBC drivers (adapters/sql)
postgresql = "42.7.13"
mariadb = "3.5.10"
ojdbc = "23.26.3.0.0"
mssql = "13.6.0.jre11"
mysql = "26.7.0"

# Crypto
bouncycastle = "1.85"

# Native / JNI
jna = "5.19.1"
jnaerator = "0.12"
netty = "4.1.138.Final"

# Commons and misc
commons-cli = "1.11.0"
commons-codec = "1.22.1"
commons-collections = "3.2.2"
commons-io = "2.22.0"
commons-math3 = "3.6.1"
guava = "33.7.1-jre"
javax-annotation = "1.3.2"

# Test
mockk = "1.14.11"

[libraries]
# Kotlin
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin-reflect" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# AWS SDK v2
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
awssdk-apache5-client = { module = "software.amazon.awssdk:apache5-client", version.ref = "awssdk" }
# Required at RUNTIME by iceberg-aws: HttpClientProperties.loadHttpClientConfigurations reflectively
# looks up software.amazon.awssdk.http.apache.ApacheHttpClient$Builder, so removing this artifact
# fails at runtime with NoClassDefFoundError even though nothing references it at compile time.
awssdk-apache-client = { module = "software.amazon.awssdk:apache-client", version.ref = "awssdk" }
awssdk-auth = { module = "software.amazon.awssdk:auth", version.ref = "awssdk" }
awssdk-aws-core = { module = "software.amazon.awssdk:aws-core", version.ref = "awssdk" }
awssdk-cloudwatch = { module = "software.amazon.awssdk:cloudwatch", version.ref = "awssdk" }
awssdk-firehose = { module = "software.amazon.awssdk:firehose", version.ref = "awssdk" }
awssdk-iot = { module = "software.amazon.awssdk:iot", version.ref = "awssdk" }
awssdk-iotdataplane = { module = "software.amazon.awssdk:iotdataplane", version.ref = "awssdk" }
awssdk-iotsitewise = { module = "software.amazon.awssdk:iotsitewise", version.ref = "awssdk" }
awssdk-kinesis = { module = "software.amazon.awssdk:kinesis", version.ref = "awssdk" }
awssdk-lambda = { module = "software.amazon.awssdk:lambda", version.ref = "awssdk" }
awssdk-secretsmanager = { module = "software.amazon.awssdk:secretsmanager", version.ref = "awssdk" }
awssdk-sns = { module = "software.amazon.awssdk:sns", version.ref = "awssdk" }
awssdk-sqs = { module = "software.amazon.awssdk:sqs", version.ref = "awssdk" }
awssdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awssdk" }
awssdk-s3tables = { module = "software.amazon.awssdk:s3tables", version.ref = "awssdk" }
awssdk-sts = { module = "software.amazon.awssdk:sts", version.ref = "awssdk" }
awssdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client", version.ref = "awssdk" }
awssdk-crt = { module = "software.amazon.awssdk.crt:aws-crt", version.ref = "awssdk-crt" }
aws-encryption-sdk = { module = "com.amazonaws:aws-encryption-sdk-java", version.ref = "aws-encryption-sdk" }
aws-sdk-v1-core = { module = "com.amazonaws:aws-java-sdk-core", version.ref = "aws-sdk-v1-core" }
msk-iam-auth = { module = "software.amazon.msk:aws-msk-iam-auth", version.ref = "msk-iam-auth" }

# Logging
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# Serialization / data
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpcKotlin" }
jmespath-core = { module = "io.burt:jmespath-core", version.ref = "jmespath" }
velocity-engine-core = { module = "org.apache.velocity:velocity-engine-core", version.ref = "velocity-engine" }
velocity-tools-generic = { module = "org.apache.velocity.tools:velocity-tools-generic", version.ref = "velocity-tools" }

# Big data
iceberg-api = { module = "org.apache.iceberg:iceberg-api", version.ref = "iceberg" }
iceberg-aws = { module = "org.apache.iceberg:iceberg-aws", version.ref = "iceberg" }
iceberg-core = { module = "org.apache.iceberg:iceberg-core", version.ref = "iceberg" }
iceberg-data = { module = "org.apache.iceberg:iceberg-data", version.ref = "iceberg" }
iceberg-parquet = { module = "org.apache.iceberg:iceberg-parquet", version.ref = "iceberg" }
parquet-avro = { module = "org.apache.parquet:parquet-avro", version.ref = "parquet" }
parquet-column = { module = "org.apache.parquet:parquet-column", version.ref = "parquet" }
parquet-common = { module = "org.apache.parquet:parquet-common", version.ref = "parquet" }
parquet-encoding = { module = "org.apache.parquet:parquet-encoding", version.ref = "parquet" }
parquet-hadoop = { module = "org.apache.parquet:parquet-hadoop", version.ref = "parquet" }
parquet-format = { module = "org.apache.parquet:parquet-format", version.ref = "parquet-format" }
hadoop-common = { module = "org.apache.hadoop:hadoop-common", version.ref = "hadoop" }
hadoop-client = { module = "org.apache.hadoop:hadoop-client", version.ref = "hadoop" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }

# Protocols
milo-sdk-client = { module = "org.eclipse.milo:milo-sdk-client", version.ref = "milo" }
milo-sdk-server = { module = "org.eclipse.milo:milo-sdk-server", version.ref = "milo" }
milo-transport = { module = "org.eclipse.milo:milo-transport", version.ref = "milo" }
paho-mqttv3 = { module = "org.eclipse.paho:org.eclipse.paho.client.mqttv3", version.ref = "paho" }
plc4j-driver-s7 = { module = "org.apache.plc4x:plc4j-driver-s7", version.ref = "plc4x" }
snmp4j = { module = "org.snmp4j:snmp4j", version.ref = "snmp4j" }
jnats = { module = "io.nats:jnats", version.ref = "jnats" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }

# JDBC drivers
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mariadb-java-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
ojdbc8 = { module = "com.oracle.database.jdbc:ojdbc8", version.ref = "ojdbc" }
mssql-jdbc = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }

# Crypto
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

# Native / JNI
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jnaerator-runtime = { module = "com.nativelibs4java:jnaerator-runtime", version.ref = "jnaerator" }
netty-codec = { module = "io.netty:netty-codec", version.ref = "netty" }

# Commons and misc
commons-cli = { module = "commons-cli:commons-cli", version.ref = "commons-cli" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commons-codec" }
commons-collections = { module = "commons-collections:commons-collections", version.ref = "commons-collections" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
commons-math3 = { module = "org.apache.commons:commons-math3", version.ref = "commons-math3" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
javax-annotation-api = { module = "javax.annotation:javax.annotation-api", version.ref = "javax-annotation" }

# Test
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[bundles]
log4j = ["log4j-api", "log4j-core", "log4j-slf4j2-impl"]
iceberg = ["iceberg-api", "iceberg-aws", "iceberg-core", "iceberg-data", "iceberg-parquet"]
parquet = ["parquet-avro", "parquet-column", "parquet-common", "parquet-encoding", "parquet-hadoop"]
grpc = ["grpc-netty-shaded", "grpc-protobuf", "grpc-stub"]
jdbc-drivers = ["postgresql", "mariadb-java-client", "ojdbc8", "mssql-jdbc", "mysql-connector-j"]

[plugins]
# Gradle API floor 9.2.0, satisfied by the 9.7.1 wrapper
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
# 0.9.4 declared protoc dependencies with the multi-string notation Gradle 10 removes
protobuf = { id = "com.google.protobuf", version = "0.9.6" }
