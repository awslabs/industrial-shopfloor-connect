components:
  securitySchemes:
    # `type: apiKey` is what API Gateway REST requires for a Cognito user pool authorizer on
    # import. It does NOT mean an API key is required and no usage plan is involved. Linters flag
    # this combination; .spectral.yaml disables that rule for this reason.
    CognitoUserPool:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - '{{USER_POOL_ARN}}'

  schemas:
    # ------------------------------------------------------------------------------------------
    # Requests.
    #
    # Constraints are written out in full in each schema rather than shared through a nested $ref.
    # API Gateway rewrites $ref to model URIs on import and a property-level $ref into another
    # components.schemas entry is not reliably preserved, which would silently drop the pattern
    # checks. test/openapi.test.ts asserts the duplicated constraint blocks stay identical.
    #
    # Note also what API Gateway request validation will NOT enforce, and which the Lambda
    # therefore enforces itself: minItems/maxItems (parsed but ignored), default, and any
    # cross-field rule such as t0Ms < t1Ms.
    # ------------------------------------------------------------------------------------------
    EmptyRequest:
      type: object
      additionalProperties: false
      properties: {}

    CatalogRequest:
      type: object
      additionalProperties: false
      required: [tableBucket]
      properties:
        tableBucket:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
          description: S3 Tables table bucket name.

    TableRequest:
      type: object
      additionalProperties: false
      required: [tableBucket, namespace, table]
      properties:
        tableBucket:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
        namespace:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-z0-9][a-z0-9_]{0,254}$'
        table:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-z0-9][a-z0-9_]{0,254}$'

    ExtentRequest:
      type: object
      additionalProperties: false
      required: [tableBucket, namespace, table, timeColumn]
      properties:
        tableBucket:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
        namespace:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-z0-9][a-z0-9_]{0,254}$'
        table:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-z0-9][a-z0-9_]{0,254}$'
        timeColumn:
          type: string
          minLength: 1
          maxLength: 255
          description: Must name a column the schema operation reported with role "time".

    DistinctRequest:
      type: object
      additionalProperties: false
      required: [tableBucket, namespace, table, dimensionColumn]
      properties:
        tableBucket:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
        namespace:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-z0-9][a-z0-9_]{0,254}$'
        table:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-z0-9][a-z0-9_]{0,254}$'
        dimensionColumn:
          type: string
          minLength: 1
          maxLength: 255
        limit:
          type: integer
          minimum: 1
          maximum: 1000

    SeriesRequest:
      type: object
      additionalProperties: false
      required: [tableBucket, namespace, table, timeColumn, valueColumns, t0Ms, t1Ms, bucketMs]
      properties:
        tableBucket:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
        namespace:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-z0-9][a-z0-9_]{0,254}$'
        table:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-z0-9][a-z0-9_]{0,254}$'
        timeColumn:
          type: string
          minLength: 1
          maxLength: 255
        valueColumns:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: Numeric columns to aggregate. At least one; the Lambda enforces the count.
        dimensionColumn:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional. Pivots a narrow table into one series per dimension value.
        dimensionValues:
          type: array
          items:
            type: string
            maxLength: 512
        t0Ms:
          type: integer
          description: Window start, epoch milliseconds, inclusive.
        t1Ms:
          type: integer
          description: Window end, epoch milliseconds, exclusive.
        bucketMs:
          type: integer
          minimum: 1
          description: Bucket width in milliseconds. Snapped server-side to a fixed ladder.
        maxPoints:
          type: integer
          minimum: 1
          maximum: 20000

    TrendRequest:
      type: object
      additionalProperties: false
      required: [tableBucket, namespace, table, timeColumn, valueColumns, t0Ms, t1Ms]
      properties:
        tableBucket:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
        namespace:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-z0-9][a-z0-9_]{0,254}$'
        table:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-z0-9][a-z0-9_]{0,254}$'
        timeColumn:
          type: string
          minLength: 1
          maxLength: 255
        valueColumns:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
        dimensionColumn:
          type: string
          minLength: 1
          maxLength: 255
        dimensionValues:
          type: array
          items:
            type: string
            maxLength: 512
        t0Ms:
          type: integer
        t1Ms:
          type: integer

    RowsRequest:
      type: object
      additionalProperties: false
      required: [tableBucket, namespace, table]
      properties:
        tableBucket:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
        namespace:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-z0-9][a-z0-9_]{0,254}$'
        table:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-z0-9][a-z0-9_]{0,254}$'
        timeColumn:
          type: string
          minLength: 1
          maxLength: 255
        t0Ms:
          type: integer
        t1Ms:
          type: integer
        limit:
          type: integer
          minimum: 1
          maximum: 5000

    SqlRequest:
      type: object
      additionalProperties: false
      required: [tableBucket, sql]
      properties:
        tableBucket:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
        sql:
          type: string
          minLength: 1
          maxLength: 20000
          description: A single SELECT or WITH statement. The catalog is attached as "ice".
        limit:
          type: integer
          minimum: 1
          maximum: 5000

    # ------------------------------------------------------------------------------------------
    # Responses.
    # ------------------------------------------------------------------------------------------
    BucketsResponse:
      type: object
      properties:
        tableBuckets:
          type: array
          items:
            type: string
        allowAny:
          type: boolean
          description: True when any table bucket in the account may be queried.
        region:
          type: string

    CatalogResponse:
      type: object
      properties:
        tableBucket:
          type: string
        namespaces:
          type: array
          items:
            type: object
            properties:
              namespace:
                type: string
              tables:
                type: array
                items:
                  type: string

    SchemaResponse:
      type: object
      properties:
        tableBucket:
          type: string
        namespace:
          type: string
        table:
          type: string
        columns:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              role:
                type: string
                enum: [time, numeric, dimension, other]

    ExtentResponse:
      type: object
      properties:
        minMs:
          type: integer
        maxMs:
          type: integer
        rowCount:
          type: integer

    DistinctResponse:
      type: object
      properties:
        column:
          type: string
        values:
          type: array
          items:
            type: string
        truncated:
          type: boolean

    SeriesResponse:
      type: object
      properties:
        bucketMs:
          type: integer
          description: The snapped bucket width actually used, which may differ from the request.
        t0Ms:
          type: integer
        t1Ms:
          type: integer
        series:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: Column name, or "column / dimensionValue" when pivoted.
              column:
                type: string
              dimension:
                type: string
              points:
                type: array
                description: '[bucketStartMs, avg, min, max, count] per bucket, ascending.'
                items:
                  type: array
                  items:
                    type: number
        truncated:
          type: boolean

    TrendResponse:
      type: object
      properties:
        xOriginMs:
          type: integer
          description: Slopes are per second relative to this instant.
        fits:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              slopePerSecond:
                type: number
              intercept:
                type: number
              r2:
                type: number
              corr:
                type: number
              n:
                type: integer

    RowsResponse:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          description: Positional arrays aligned to `columns`. Index by name, not by position.
          items:
            type: array
            items: {}
        rowCount:
          type: integer
        truncated:
          type: boolean

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >-
                Closed set. From API Gateway: UNAUTHORIZED, ACCESS_DENIED, EXPIRED_TOKEN,
                INVALID_SIGNATURE, NO_SUCH_ROUTE, BAD_REQUEST_BODY, BAD_REQUEST_PARAMETERS,
                UNSUPPORTED_MEDIA_TYPE, THROTTLED, INTEGRATION_TIMEOUT, INTEGRATION_FAILURE.
                From the query function: BAD_REQUEST, FORBIDDEN_BUCKET, NOT_FOUND, QUERY_ERROR,
                QUERY_TIMEOUT, SQL_DISABLED, INTERNAL.
            message:
              type: string
            requestId:
              type: string
              description: API Gateway request id; matches the access log entry.
