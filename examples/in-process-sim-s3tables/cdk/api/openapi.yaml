  /api/series:
    post:
      operationId: downsampleSeries
      tags: [query]
      summary: Time-bucketed downsample of one or more numeric columns
      description: >-
        The drill-down workhorse. Buckets rows by integer epoch arithmetic and returns avg, min,
        max and count per bucket per series, so a zoomed window is re-queried at a finer bucket
        width rather than resampled in the browser.
      security:
        - CognitoUserPool: []
