  # -c allowFreeSql=true, so it is absent from the API surface in a default deployment.
  #
  # Why it is off: DuckDB must keep enable_external_access at its default true, because Iceberg
  # data file paths are discovered at query time and cannot be allowlisted. Arbitrary SQL through
  # an authenticated endpoint therefore reaches read_text('/proc/self/environ'), which returns the
  # Lambda execution role's credentials, and COPY ... TO 's3://...' / read_csv('http://...'), which
  # are exfiltration and SSRF primitives. When enabled, the handler disables the local filesystem
  # after loading extensions and accepts exactly one SELECT or WITH statement -- but an outbound
  # HTTP GET remains reachable. Enable for local experimentation only.
