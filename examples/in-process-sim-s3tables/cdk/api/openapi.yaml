#
# Source of truth for the API surface of the SFC S3 Tables DuckDB query app.
# `lib/openapi.ts` loads this file, substitutes the {{PLACEHOLDER}} tokens below,
# and hands the resulting object to apigateway.ApiDefinition.fromInline().
#
# Placeholders substituted by CDK at synth time (nothing else is templated):
#   {{LAMBDA_INVOKE_URI}}   full apigateway:lambda:path integration URI of the query function
#   {{USER_POOL_ARN}}       ARN of the Cognito user pool backing the authorizer
#   {{CORS_ALLOW_ORIGIN}}   single allowed origin, or the sentinel handled by lib/openapi.ts
#   {{CORS_ALLOW_HEADERS}}  Access-Control-Allow-Headers value
#   {{CORS_ALLOW_METHODS}}  Access-Control-Allow-Methods value
#   {{CORS_MAX_AGE}}        Access-Control-Max-Age value
#   {{SERVER_HOST}}         CloudFront distribution domain, no scheme
#
# INVARIANTS enforced by test/openapi.test.ts, not by API Gateway:
#   * every path item declares exactly `post`, or `post` + `options`, and nothing else
#   * every `post` carries `security: [{CognitoUserPool: []}]` with an EMPTY scope array
#     (a non-empty array switches API Gateway to access-token mode and the SPA's ID token 401s)
#   * every `options` carries NO security (a CORS preflight cannot be authenticated)
#   * there is NO root-level `security:` — API Gateway IGNORES it on REST import, which would
#     silently deploy every endpoint with no authorizer at all
openapi: 3.0.1

info:
  title: SFC S3 Tables DuckDB Query API
  version: 1.0.0
  description: >-
    Read-only SQL access to Apache Iceberg tables in Amazon S3 Tables, executed by DuckDB inside
    AWS Lambda. Written for industrial timeseries produced by Shop Floor Connectivity (SFC):
    high-frequency, mainly numeric float machine readings.

    Every operation is a POST. The API is schema-agnostic: callers discover namespaces, tables and
    columns through the catalog operations and the server composes SQL from validated identifiers.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Shop Floor Connectivity
    url: https://github.com/awslabs/industrial-shopfloor-connect

# Documentation only, so generators and API clients have a base URL. Deliberately not a base path:
# API Gateway derives basePath from a server URL path, and with basepath=prepend that would silently
# produce /api/api/....
servers:
  - url: 'https://{host}'
    description: CloudFront distribution that serves both the web app and this API
    variables:
      host:
        default: '{{SERVER_HOST}}'
        description: CloudFront distribution domain, from the stack's SiteUrl output.

tags:
  - name: catalog
    description: Discover table buckets, namespaces, tables and columns.
  - name: query
    description: Read timeseries data and fit trends.
  - name: cors
    description: Unauthenticated CORS preflight responses.

# Validate request bodies at the edge. This is input hygiene only: it rejects malformed bodies
# before a Lambda cold start. It is NOT the security boundary -- API Gateway skips validation
# entirely when the request Content-Type matches no declared media type, so the Lambda re-validates
# every identifier against the live Iceberg catalog and rejects non-JSON content types.
x-amazon-apigateway-request-validators:
  body-only:
    validateRequestBody: true
    validateRequestParameters: false
x-amazon-apigateway-request-validator: body-only

# Every error in this API -- from the authorizer, the validator, the throttle or the Lambda --
# uses the ErrorEnvelope shape. Notes on the templates below:
#   * $context.error.messageString is ALREADY quoted; adding quotes yields ""msg""
#   * $context.error.validationErrorString is NOT quoted and can itself contain double quotes,
#     so it is never interpolated -- these templates are not VTL and have no escape function
#   * DEFAULT_4XX / DEFAULT_5XX carry templates ONLY. Setting statusCode on a DEFAULT rewrites
#     the status code of every sibling response.
x-amazon-apigateway-gateway-responses:
  UNAUTHORIZED:
    statusCode: 401
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/json'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'{{CORS_ALLOW_ORIGIN}}'"
      gatewayresponse.header.Vary: "'Origin'"
    responseTemplates:
      application/json: '{"error":{"code":"UNAUTHORIZED","message":$context.error.messageString,"requestId":"$context.requestId"}}'
  ACCESS_DENIED:
    statusCode: 403
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/json'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'{{CORS_ALLOW_ORIGIN}}'"
      gatewayresponse.header.Vary: "'Origin'"
    responseTemplates:
      application/json: '{"error":{"code":"ACCESS_DENIED","message":$context.error.messageString,"requestId":"$context.requestId"}}'
  EXPIRED_TOKEN:
    statusCode: 401
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/json'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'{{CORS_ALLOW_ORIGIN}}'"
      gatewayresponse.header.Vary: "'Origin'"
    responseTemplates:
      application/json: '{"error":{"code":"EXPIRED_TOKEN","message":$context.error.messageString,"requestId":"$context.requestId"}}'
  INVALID_SIGNATURE:
    statusCode: 403
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/json'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'{{CORS_ALLOW_ORIGIN}}'"
      gatewayresponse.header.Vary: "'Origin'"
    responseTemplates:
      application/json: '{"error":{"code":"INVALID_SIGNATURE","message":$context.error.messageString,"requestId":"$context.requestId"}}'
  # POST-only means any GET/HEAD, or any path that is not in this document, is rejected here --
  # BEFORE the authorizer runs, so it happens to signed-in users too. API Gateway's stock body is
  # {"message":"Missing Authentication Token"}, which reads like a broken login. Remap it to a 404
  # NO_SUCH_ROUTE. This hides nothing: a missing Authorization header on a path that IS defined
  # yields UNAUTHORIZED above, not this type.
  MISSING_AUTHENTICATION_TOKEN:
    statusCode: 404
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/json'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'{{CORS_ALLOW_ORIGIN}}'"
      gatewayresponse.header.Vary: "'Origin'"
    responseTemplates:
      application/json: '{"error":{"code":"NO_SUCH_ROUTE","message":"No such route. Every operation in this API is a POST to a path under /api/.","requestId":"$context.requestId"}}'
  BAD_REQUEST_BODY:
    statusCode: 400
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/json'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'{{CORS_ALLOW_ORIGIN}}'"
      gatewayresponse.header.Vary: "'Origin'"
    responseTemplates:
      application/json: '{"error":{"code":"BAD_REQUEST_BODY","message":"Request body failed schema validation.","requestId":"$context.requestId"}}'
  BAD_REQUEST_PARAMETERS:
    statusCode: 400
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/json'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'{{CORS_ALLOW_ORIGIN}}'"
      gatewayresponse.header.Vary: "'Origin'"
    responseTemplates:
      application/json: '{"error":{"code":"BAD_REQUEST_PARAMETERS","message":"Request parameters failed validation.","requestId":"$context.requestId"}}'
  UNSUPPORTED_MEDIA_TYPE:
    statusCode: 415
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/json'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'{{CORS_ALLOW_ORIGIN}}'"
      gatewayresponse.header.Vary: "'Origin'"
    responseTemplates:
      application/json: '{"error":{"code":"UNSUPPORTED_MEDIA_TYPE","message":"Send Content-Type: application/json.","requestId":"$context.requestId"}}'
  THROTTLED:
    statusCode: 429
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/json'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'{{CORS_ALLOW_ORIGIN}}'"
      gatewayresponse.header.Vary: "'Origin'"
    responseTemplates:
      application/json: '{"error":{"code":"THROTTLED","message":"Too many requests. Retry shortly.","requestId":"$context.requestId"}}'
  INTEGRATION_TIMEOUT:
    statusCode: 504
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/json'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'{{CORS_ALLOW_ORIGIN}}'"
      gatewayresponse.header.Vary: "'Origin'"
    responseTemplates:
      application/json: '{"error":{"code":"INTEGRATION_TIMEOUT","message":"The query exceeded the 29 second API Gateway limit. Narrow the time window or widen bucketMs.","requestId":"$context.requestId"}}'
  INTEGRATION_FAILURE:
    statusCode: 502
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/json'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'{{CORS_ALLOW_ORIGIN}}'"
      gatewayresponse.header.Vary: "'Origin'"
    responseTemplates:
      application/json: '{"error":{"code":"INTEGRATION_FAILURE","message":"The query function did not return a valid response. It may have run out of memory; check its log group.","requestId":"$context.requestId"}}'
  DEFAULT_4XX:
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/json'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'{{CORS_ALLOW_ORIGIN}}'"
      gatewayresponse.header.Vary: "'Origin'"
    responseTemplates:
      application/json: '{"error":{"code":"$context.error.responseType","message":$context.error.messageString,"requestId":"$context.requestId"}}'
  DEFAULT_5XX:
    responseParameters:
      gatewayresponse.header.Content-Type: "'application/json'"
      gatewayresponse.header.Access-Control-Allow-Origin: "'{{CORS_ALLOW_ORIGIN}}'"
      gatewayresponse.header.Vary: "'Origin'"
    responseTemplates:
      application/json: '{"error":{"code":"$context.error.responseType","message":$context.error.messageString,"requestId":"$context.requestId"}}'

paths:
  /api/buckets:
    post:
      operationId: listBuckets
      tags: [catalog]
      summary: List the S3 Tables table buckets this deployment may query
      description: >-
        Returns the deploy-time allowlist. When the stack was deployed with allowAnyTableBucket,
        returns every table bucket in the account and region instead.
      security:
        - CognitoUserPool: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
      responses:
        '200':
          description: Table buckets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketsResponse'
        '400':
          description: Malformed body, or an identifier that is not in the table's live schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing, expired or invalid ID token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Table bucket is not in this deployment's allowlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Table bucket, namespace or table does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unhandled error in the query function.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '504':
          description: The query exceeded the integration timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: '{{LAMBDA_INVOKE_URI}}'
        passthroughBehavior: never
        timeoutInMillis: 29000
    options:
      operationId: preflightBuckets
      tags: [cors]
      summary: CORS preflight
      description: Unauthenticated by design; a CORS preflight cannot carry credentials.
      responses:
        '204':
          description: CORS preflight response. No body.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Max-Age:
              schema:
                type: string
            Vary:
              schema:
                type: string
      x-amazon-apigateway-integration:
        type: mock
        requestTemplates:
          application/json: '{"statusCode":204}'
        passthroughBehavior: when_no_match
        responses:
          default:
            statusCode: '204'
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: "'{{CORS_ALLOW_ORIGIN}}'"
              method.response.header.Access-Control-Allow-Headers: "'{{CORS_ALLOW_HEADERS}}'"
              method.response.header.Access-Control-Allow-Methods: "'{{CORS_ALLOW_METHODS}}'"
              method.response.header.Access-Control-Max-Age: "'{{CORS_MAX_AGE}}'"
              method.response.header.Vary: "'Origin'"

